# Stories that are not news. Skipped at ingestion, and removed from storage at the next run
# if a rule is added later. Matching is case-insensitive.
#
# Press releases: paid or company-written announcements that some publishers host next to
# their reporting. Business Standard runs ANI's press-release wire under
# /content/press-releases-ani/ (about a third of its GDELT-discovered items, 2026-10-14), and
# event and award announcements under /content/specials/ (seen 2026-10-15, e.g. a company's
# "most preferred workplace" ceremony).

not_news:
  url_contains:
    - /press-releases
    - /press-release/
    - /pr-newswire/
    - /business-wire/
    - /sponsored/
    - /brand-studio/
    - /content/specials/
  title_contains:
    - "®"
    - "™"
    - "(sponsored)"
