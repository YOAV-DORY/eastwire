# Images are shown only as clearly labelled "Illustrative image", never as a photo of the reported event.
# Rules (checked by scripts/validate_config.py and ImageCatalog):
#   - license is one of CC0, Public domain, CC BY 2.0-4.0, CC BY-SA 2.0-4.0; anything else is rejected;
