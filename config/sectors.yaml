# Sector tagging rules. Rule-based on purpose: every tag can be explained to the reader by
# the exact rules that matched. No machine learning, no AI.
#
# How an article is scored (docs/sectors.md has worked examples):
#   - keyword in the headline:            its weight
#   - keyword only in the shown excerpt:  its weight x excerpt_factor
#   - Global Voices topic tag:            its weight
#   - GDELT theme code:                   its weight, at most theme_cap per sector in total,
#                                         because GDELT themes come from text we never show
#   - negative phrase in headline/excerpt: minus its weight
# A sector is tagged when its score >= threshold. At most max_sectors per article, highest
# score first; ties keep the order below. Anything else is "Unclassified".
#
# Matching: case-insensitive, on whole words after punctuation is turned into spaces
# ("AI-powered" -> "ai powered"). A trailing * matches word endings ("tariff*" matches
# "tariffs"); a GDELT theme ending in * matches every code with that prefix.
#
# Editing this file re-tags every stored article on the next hourly run.

threshold: 3
max_sectors: 2
excerpt_factor: 0.5
theme_cap: 2

