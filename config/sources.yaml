# EastWire source registry: the machine-readable form of docs/source-matrix.md.
# Ingestion reads this file; a source runs only if `enabled: true`.
#
# status:       verified | conditional | excluded
#               (excluded and conditional sources must stay enabled: false;
#                scripts/validate_config.py enforces this)
# display_mode: headline_excerpt | headline_only | embed | none
# All evidence was checked on the date given in `evidence.checked_on`.

sources:
  # --------------------------------------------------------------- news and discovery
  - slug: gdelt-gkg
    name: GDELT GKG 2.x raw files (English stream)
    kind: discovery
    connector: gdelt_gkg
    endpoint: https://data.gdeltproject.org/gdeltv2/lastupdate.txt
    coverage: Global; filtered to phase-1 countries by FIPS code
    auth: none
    quota: No published quota; about 5 MB zipped per 15-minute file
    status: verified
    enabled: true
    display_mode: headline_only     # and only for domains with decision=allow in domains.yaml
    max_excerpt_chars: 0
    images: false
    attribution: "Data: The GDELT Project (gdeltproject.org)"
    retention_days: 30
    evidence:
      url: https://gdeltproject.org/about.html
      checked_on: 2026-10-13
      note: >-
        Open use with a required citation and link; says nothing about the copyright of the
        underlying articles. Live test: lastupdate.txt is current; the newest listed file can
        return 404 for several minutes after being listed.

  - slug: gdelt-doc
    name: GDELT DOC 2.0 API
    kind: discovery
    connector: gdelt_doc
    endpoint: https://api.gdeltproject.org/api/v2/doc/doc
    auth: none
    quota: One request every 5 seconds; 429s observed even after a 5-minute pause
    status: conditional
    enabled: false
    display_mode: headline_only
    max_excerpt_chars: 0
    images: false
    attribution: "Data: The GDELT Project (gdeltproject.org)"
    retention_days: 30
    evidence:
      url: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
      checked_on: 2026-10-13
      note: Returned empty {} results, then a plain-text rate-limit message with HTTP 200, then 429.

  - slug: gdelt-geo
    name: GDELT GEO 2.0 API
    kind: discovery
    connector: none
    endpoint: https://api.gdeltproject.org/api/v2/geo/geo
    status: excluded
    enabled: false
    display_mode: none
    evidence:
      url: https://blog.gdeltproject.org/gdelt-geo-2-0-api-debuts/
      checked_on: 2026-10-13
      note: HTTP 404 on all four parameter variants tested.

  - slug: global-voices
    name: Global Voices
    kind: news_feed
    connector: global_voices_rss
    story_type: feature      # citizen-media analysis and essays: the reading section, not Latest
    # Country feeds, plus topic feeds whose items are kept only if Global Voices tagged them
    # with a covered country (the RSS <category> list).
    feeds:
      - https://globalvoices.org/-/world/east-asia/china/feed/
      - https://globalvoices.org/-/world/east-asia/japan/feed/
      - https://globalvoices.org/-/world/east-asia/south-korea/feed/
      - https://globalvoices.org/-/world/south-asia/india/feed/
      - https://globalvoices.org/-/topics/economics-business/feed/
      - https://globalvoices.org/-/topics/politics/feed/
      - https://globalvoices.org/-/topics/technology/feed/
      - https://globalvoices.org/-/topics/environment/feed/
    publisher_country: null   # international network; publisher location not shown
    auth: none
    quota: none stated
    status: verified
    enabled: true
    display_mode: headline_excerpt
    max_excerpt_chars: 300     # from the feed <description>, cut at a sentence boundary
    images: false              # media can be licensed differently from the text
    summaries: true            # CC BY 3.0 allows adaptations with credit (docs/summaries.md)
    license:
      name: CC BY 3.0
      url: https://creativecommons.org/licenses/by/3.0/
    # Shown as: "By {author}, Global Voices · CC BY 3.0 · excerpt, shortened". The license part is
    # dropped for partner reprints and the excerpt note when no excerpt is shown.
    attribution: "By {author}, Global Voices"
    excerpt_note: "excerpt, shortened"
    partner_reprints: link_only   # posts republished from other outlets show headline + link only
    retention_days: 90
    evidence:
      url: https://globalvoices.org/about/global-voices-attribution-policy/
      checked_on: 2026-10-13
      note: Policy "Updated 9 April 2025"; text under CC BY; media may be licensed differently.

  # Direct headline feeds from publishers whose terms were read on 2026-10-15. Headline, link,
  # publisher credit and publication time only: no excerpt, no images. The feed text is read
  # only to find datelines and places, and is not stored. See docs/source-matrix.md.
  - slug: mainichi-english
    name: The Mainichi (English edition) latest-articles RSS
    kind: news_feed
    connector: headline_rss
    feeds:
      - https://mainichi.jp/rss/etc/english_latest.rss
    publisher: The Mainichi
    publisher_country: JP
    publisher_city_geonames_id: 1850147            # Tokyo
    # Mainichi's English feed mixes Japan news with world wire copy; an item is kept only when
    # its headline or dateline places it in a covered country.
    covers_country: null
    story_type: news
    auth: none
    quota: 20 latest items; checked hourly
    status: verified
    enabled: true
    display_mode: headline_only
    max_excerpt_chars: 0
    images: false
    summaries: true          # use is restricted only for commercial purposes; EastWire is non-commercial
    attribution: "The Mainichi"
    retention_days: 30
    evidence:
      url: https://mainichi.jp/english/rss/
      checked_on: 2026-10-15
      note: >-
        The RSS page's own terms prohibit only commercial use of the RSS service. The copyright
        page (reviewed 2026-10-13, rule A1) has no clause on linking. robots.txt names only AI
        crawlers. EastWire is non-commercial and shows headline links only.

