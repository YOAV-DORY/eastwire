    publisher: Korea.net
    publisher_label: South Korean government
    publisher_label_evidence: https://www.korea.net/   # footer: "KOREA.net Copyright © Ministry of Culture, Sports and Tourism"
    publisher_country: KR
    publisher_city_geonames_id: 1835848            # Seoul
    covers_country: KR       # a Korea-only publication
    story_type: news
    skip_categories: ["Honorary Reporters", "Korea in photos"]   # readers' posts and galleries, not news
    feed_timezone: Asia/Seoul
    feed_time_precision: day # "2026-10-15 00:00:00.0": the day only
    auth: none
    quota: 20 latest items; checked hourly
    status: verified
    enabled: true
    display_mode: headline_only
    max_excerpt_chars: 0
    images: false
    summaries: false
    attribution: "Korea.net"
    retention_days: 30
    evidence:
      url: https://www.korea.net/Others/Subscribe-to-Koreanet/RSS-Service
      checked_on: 2026-10-15
      note: >-
        Rule A1: the government portal publishes RSS feeds for subscription and has no terms page,
        only "Copyright © Ministry of Culture, Sports and Tourism" (residual risk R1). robots.txt
        allows everything except site search. The feed sets a session cookie on a redirect.

