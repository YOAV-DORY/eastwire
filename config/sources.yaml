# Map and gazetteer providers (attribution is mandatory wherever they appear).
map_providers:
  - slug: osm-tiles
    url_template: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    status: verified
    attribution: "© OpenStreetMap contributors"
    rules: [valid Referer, no bulk download or prefetch, respect caching, no SLA]
    evidence: { url: https://operations.osmfoundation.org/policies/tiles/, checked_on: 2026-10-13 }
  - slug: carto-dark
    url_template: https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key={key}
    status: conditional
    attribution: "© OpenStreetMap contributors © CARTO"
    rules: [free API key, non-commercial up to 5M tile requests/month, read basemap terms first]
    evidence: { url: https://github.com/CartoDB/basemap-styles, checked_on: 2026-10-13 }
  - slug: geonames
    url_template: https://download.geonames.org/export/dump/cities15000.zip
    status: verified
    attribution: "GeoNames (geonames.org), CC BY 4.0"
    evidence: { url: https://download.geonames.org/export/dump/readme.txt, checked_on: 2026-10-13 }
