    covers_country: CN       # a China-only publication
    story_type: news
    feature_categories: [FEATURES, "Q & A", VOICES, "VOICES & OPINION", PODCAST]
    auth: none
    quota: About 50 items spanning a week; checked hourly
    status: verified
    enabled: true
    display_mode: headline_only
    max_excerpt_chars: 0
    images: false
    summaries: true          # citing is allowed with credit by name
    attribution: "Sixth Tone"
    retention_days: 30
    evidence:
