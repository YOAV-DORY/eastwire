      - https://www.businesskorea.co.kr/rss/S1N27.xml
    publisher: BusinessKorea
    publisher_country: KR
    publisher_city_geonames_id: 1835848            # Seoul
    covers_country: KR
    story_type: news
    feed_timezone: Asia/Seoul  # "2026-10-15 16:44:03", Seoul time without a zone
    auth: none
    quota: 20 latest items per feed; checked hourly
    status: verified
    enabled: true
    display_mode: headline_only
    max_excerpt_chars: 0
    images: false
    summaries: false
    attribution: "BusinessKorea"
