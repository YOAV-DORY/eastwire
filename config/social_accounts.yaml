# Curated social accounts. Their posts appear only in the separate, labelled social section,
# through the platform's official embed, and never mix with news cards.
#
# Rules for adding an account (docs/social.md):
#   - kind: newsroom | journalist | official. No commentators, no anonymous accounts.
#   - Bluesky: a domain-verified handle (the handle is the outlet's own domain), so the
#     account cannot be an impersonator. YouTube: the outlet's official channel.
#   - Posts in English (EastWire shows no translations).
#   - The publisher's domain must not be `deny` in domains.yaml, and its source must not be
#     excluded or awaiting a check in sources.yaml (Japan Times, NHK).
#   - reason and evidence_url say why the account is here; checked_on is when.
#   - scope: all = every original post; mentions = only posts whose text names a covered
#     country or city (for outlets that cover the whole world).
# Location is never inferred from the account: only places named in a post count.

accounts:
  # ---------------------------------------------------------------- Bluesky
  - platform: bluesky
    id: did:plc:ibwdymi2pdjcfscefihqcaj6
    handle: scroll.in
    name: Scroll
    kind: newsroom
    domain: scroll.in
    scope: all
    reason: Indian digital newsroom; its site is on our reviewed allowlist.
    evidence_url: https://bsky.app/profile/scroll.in
    checked_on: 2026-10-14

