# Local Postgres for development: `docker compose up -d` (or OrbStack / Colima).
# Mirrors production's two roles: ingest_writer (runs migrations, writes) and api_reader (SELECT only).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eastwire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
    ports:
      - "5432:5432"
    volumes:
      - ./backend/db/local-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eastwire"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
