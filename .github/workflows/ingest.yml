name: Ingest

# The hourly ingestion job (docs/ingestion.md). Minute 17 avoids GitHub's busy top of the hour;
# GitHub may still delay or drop scheduled runs, and the cursors catch up on the next one.
# Scheduled workflows only run on the default branch, and GitHub disables them after 60 days
# without repository activity.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Off until the database exists: set the repository variable INGEST_ENABLED=true and the
    # three EASTWIRE_DB_* secrets (docs/database.md).
    if: vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the ingest job
        working-directory: backend
        run: ./gradlew :ingest:bootJar --console=plain
      - name: Run one ingestion
        env:
          EASTWIRE_DB_URL: ${{ secrets.EASTWIRE_DB_URL }}
          EASTWIRE_DB_USER: ${{ secrets.EASTWIRE_DB_USER }}
          EASTWIRE_DB_PASSWORD: ${{ secrets.EASTWIRE_DB_PASSWORD }}
          EASTWIRE_CONFIG_DIR: ${{ github.workspace }}/config
          # Optional; YouTube stays off in sources.yaml until it is set (docs/social.md).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: java -jar backend/ingest/build/libs/eastwire-ingest.jar
