name: Summary model

# Smoke test for the ingest job's local summary model (docs/summaries.md): the pinned llama.cpp
# build and Phi-3-mini start on a GitHub runner, answer, and the Java checks accept a summary.
# Runs only when the model setup or the summary code changes.
on:
  pull_request:
    paths:
      - scripts/summary-model.sh
      - backend/ingest/src/main/java/io/github/yoavdory/eastwire/ingest/summary/**
      - .github/workflows/summary-model.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/eastwire-summary-model
          key: summary-model-phi3-mini-q4-a64113399c2f-llama-b11269
      - name: Start the summary model
        run: scripts/summary-model.sh "$HOME/eastwire-summary-model"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Summarise live feed items and print them
        working-directory: backend
        env:
          EASTWIRE_SUMMARY_URL: http://127.0.0.1:8091
        run: ./gradlew :ingest:test --tests '*LocalModelSummarizerSample*' --console=plain -i | grep -E "###|TEXT:|SUMMARY:" || true
      - name: Time one summary
        run: |
          time curl -fsS http://127.0.0.1:8091/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Say OK."}],"max_tokens":5}'
