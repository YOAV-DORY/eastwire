# Extra date formats for RSS <pubDate> values that are not RFC 822. Sixth Tone writes
# "Oct 14, 2026"; without this mask Rome returns no date and the item would look newly published.
# BusinessKorea writes "2026-10-15 16:44:03" and Korea.net "2026-10-15 00:00:00.0", both Seoul time
# with no zone; such sources set feed_timezone in sources.yaml and the mapper re-reads them there.
datetime.extra.masks=MMM d, yyyy|MMM dd, yyyy|yyyy-MM-dd HH:mm:ss.S|yyyy-MM-dd HH:mm:ss|yyyy-MM-dd
