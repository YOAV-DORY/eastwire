spring:
  application:
    name: eastwire-ingest
  main:
    web-application-type: none
    banner-mode: "off"
  datasource:
    # Neon in production (role: ingest_writer). Local defaults match compose.yaml.
    url: ${EASTWIRE_DB_URL:jdbc:postgresql://localhost:5432/eastwire}
    username: ${EASTWIRE_DB_USER:ingest_writer}
    password: ${EASTWIRE_DB_PASSWORD:ingest_writer_local}
    hikari:
      maximum-pool-size: 4
  flyway:
    locations: classpath:db/migration

eastwire:
  # Path to the repo-level config/ directory. Gradle's bootRun and tests set it automatically.
  config-dir: ${EASTWIRE_CONFIG_DIR:config}
  ingest:
    run-on-startup: true
    # pg_try_advisory_lock keeps two runs (cron + manual) from overlapping.
    advisory-lock: true
  http:
    user-agent: "EastWireBot/0.1 (+https://github.com/YOAV-DORY/eastwire)"
    # Slow sites (Global Voices took 20 s to answer on 2026-10-13) need more than a few seconds.
    connect-timeout: 20s
    request-timeout: 60s
    max-attempts: 3
    base-delay: 2s
    # A source asking us to wait longer than this fails the run; the circuit breaker takes over.
    max-retry-after: 120s
  gdelt:
    base-url: https://data.gdeltproject.org/gdeltv2
    # Never process files older than this (a missed day is reported as a gap, not backfilled).
    max-lookback: 6h
    # First run ever: start this far back.
    bootstrap: 1h
  bluesky:
    # Public, unauthenticated AppView (the docs ask public web apps to use this cached host).
    base-url: https://public.api.bsky.app/xrpc/
  youtube:
    base-url: https://www.googleapis.com/youtube/v3/
    # GitHub Actions secret YOUTUBE_API_KEY; the connector fails visibly if enabled without it.
    api-key: ${YOUTUBE_API_KEY:}
