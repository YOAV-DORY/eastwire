spring:
  application:
    name: eastwire-api
  main:
    banner-mode: "off"
  datasource:
    # Neon in production with the read-only role api_reader. Local defaults match compose.yaml.
    url: ${EASTWIRE_DB_URL:jdbc:postgresql://localhost:5432/eastwire}
    username: ${EASTWIRE_DB_USER:api_reader}
    password: ${EASTWIRE_DB_PASSWORD:api_reader_local}
    hikari:
      maximum-pool-size: 3
      # Hold no idle connections: the edge Worker keeps this service awake around the clock
      # (docs/edge.md), and open connections could keep Neon's compute from scaling to zero,
      # which the free plan's compute hours depend on. Unused connections close after a minute.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 600000
      # Neon scales to zero; the first connection after a pause can take a few seconds.
      connection-timeout: 15000
      read-only: true
  flyway:
    # Only the ingest job migrates; the API's role cannot.
    enabled: false

server:
  # Render injects PORT.
  port: ${PORT:8080}
  # Render's proxy sends X-Forwarded-For; Tomcat uses it for the client address (rate limit).
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

eastwire:
  # Path to the repo-level config/ directory. Gradle's bootRun and tests set it automatically.
  config-dir: ${EASTWIRE_CONFIG_DIR:config}
  cors:
    # Comma-separated. Add the Cloudflare Pages origin when deploying.
    allowed-origins: ${EASTWIRE_CORS_ORIGINS:http://localhost:5174}
  rate-limit:
    # Requests per minute per client IP for /api/** (not /api/v1/health).
    per-minute: ${EASTWIRE_RATE_LIMIT_PER_MINUTE:120}
  status:
    # Neon Free allows 1 GB per project (docs/deploy.md); /status warns from 800 MB.
    database-limit-bytes: 1073741824
    database-warn-bytes: 838860800
